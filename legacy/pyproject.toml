[tool.poetry]
name = "game-gen"
version = "0.1.0"
description = "Ordinal/Cardinal game generator & ranking CLI"
authors = ["Lab Team"]
readme = "README.md"
packages = [{ include = "gamegen", from = "src" }, { include = "realgen", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
shap = "~=0.48"
click = "^8.1"
networkx = "^3.3"
graphviz = "^0.20.3"
pyyaml = "^6.0"
pandas = "^2.2"
matplotlib = "^3.9"
japanize-matplotlib = "^1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.6"
mypy = "^1.11"

[tool.poetry.scripts]
"game-gen" = "gamegen.cli:main"
"real-gen" = "realgen.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
select = ["E", "F", "I"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["gamegen", "realgen"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_any_unimported = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
allow_redefinition = false
strict_equality = true
plugins = []

[[tool.mypy.overrides]]
module = ["gamegen.cli"]
disallow_untyped_defs = false
disallow_untyped_calls = false
